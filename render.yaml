services:
  - type: web
    name: lyftr-chat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: chat-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_API_KEYS
        sync: false
      - key: GROQ_MODEL_1
        sync: false
      - key: GROQ_MODEL_2
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
