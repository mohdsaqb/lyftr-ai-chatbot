services:
  backend:
    build: ./backend
    environment:
      UVICORN_PORT: ${BACKEND_PORT:-8000}
      LLM_API_KEYS: ${LLM_API_KEYS:?Set the ordered Groq key pool}
      GROQ_MODEL_1: ${GROQ_MODEL_1:?Set the first Groq model}
      GROQ_MODEL_2: ${GROQ_MODEL_2:?Set the second Groq model}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the frontend origin}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:?Set the simulation switch}
    volumes:
      - chat_data:/data
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['UVICORN_PORT'] + '/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the public backend URL}
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${FRONTEND_PORT}/"']
      interval: 5s
      timeout: 4s
      retries: 5

volumes:
  chat_data:
